[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novi-lab"
version = "0.1.0"
description = "Local-first Novi Lab control plane prototype"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
deepagents = [
    "deepagents>=0.5,<0.6",
    "langchain-openai>=0.3",
    "socksio>=1.0",
]
litellm = ["litellm[proxy]>=1.0"]

[project.scripts]
novi = "novi_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
novi_lab = ["builtin_skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
